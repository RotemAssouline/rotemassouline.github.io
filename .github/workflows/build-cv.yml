name: Build CV

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile cv/cv.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: cv.tex

      - name: Commit cv.pdf
        run: |
          cp cv/cv.pdf cv.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git diff --cached --quiet || git commit -m "Rebuild cv.pdf"
          git push
